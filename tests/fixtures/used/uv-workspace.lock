version = 1
revision = 5
requires-python = ">=3.11"

[manifest]
members = [
    "member",
    "root",
]

[[package]]
name = "member"
version = "0.3.0"
source = { editable = "member" }
dependencies = [
    { name = "six" },
]

[package.metadata]
requires-dist = [{ name = "six" }]

[[package]]
name = "root"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "typing-extensions" },
]

[package.optional-dependencies]
fast = [
    { name = "zope-interface" },
]

[package.metadata]
requires-dist = [
    { name = "typing-extensions" },
    { name = "zope-interface", marker = "extra == 'fast'" },
]
provides-extras = ["fast"]

[[package]]
name = "six"
version = "1.17.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "typing-extensions"
version = "4.16.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "zope-interface"
version = "8.6"
source = { registry = "https://pypi.org/simple" }
