version = 1
revision = 5
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version >= '3.12'",
    "python_full_version < '3.12'",
]

[[package]]
name = "click"
version = "8.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "click" },
    { name = "iniconfig" },
    { name = "local-lib" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.2", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "python_full_version >= '3.12'" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "click" },
    { name = "iniconfig", git = "https://github.com/pytest-dev/iniconfig.git?tag=v2.0.0" },
    { name = "local-lib", directory = "lib" },
    { name = "numpy", index = "https://download.pytorch.org/whl/cpu" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest" }]

[[package]]
name = "iniconfig"
version = "2.0.0"
source = { git = "https://github.com/pytest-dev/iniconfig.git?tag=v2.0.0#93f5930e668c0d1ddf4597e38dd0dea4e2665e7a" }

[[package]]
name = "local-lib"
version = "0.2.0"
source = { directory = "lib" }

[[package]]
name = "numpy"
version = "2.4.6"
source = { registry = "https://download.pytorch.org/whl/cpu" }
resolution-markers = [
    "python_full_version < '3.12'",
]

[[package]]
name = "numpy"
version = "2.5.2"
source = { registry = "https://download.pytorch.org/whl/cpu" }
resolution-markers = [
    "python_full_version >= '3.12'",
]

[[package]]
name = "packaging"
version = "26.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pluggy"
version = "1.6.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pygments"
version = "2.21.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "9.1.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
    { name = "packaging" },
    { name = "pluggy" },
    { name = "pygments" },
]
