[package]
name = "refs-cli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/lukaprsina/refs-cli"

[features]
# Exposes `source::fake` to integration tests and downstream test code.
testing = []

[dependencies]
axoupdater = { version = "0.10.2", features = ["blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
fd-lock = "4.0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"

[dev-dependencies]
refs-cli = { path = ".", features = ["testing"] }
insta = "1.48.0"
url = "2.5.8"

[[bin]]
name = "refs"
path = "src/main.rs"

# Generated by `dist` (with dist-workspace.toml and .github/workflows/release.yml): keep this
# section as it wrote it, including the three keys at the end, and regenerate with `dist`.
# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
name = "refs-cli"
version = "0.1.0"
edition = "2024"
