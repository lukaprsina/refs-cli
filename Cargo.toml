[package]
name = "refs-cli"
version = "0.1.0"
edition = "2024"

[features]
# Exposes `source::fake` to integration tests and downstream test code.
testing = []

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }

[dev-dependencies]
refs-cli = { path = ".", features = ["testing"] }
insta = "1.48.0"
tempfile = "3.27.0"
