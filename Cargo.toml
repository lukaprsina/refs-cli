[package]
name = "refs-cli"
description = "Pinned, sparse checkouts of your dependencies' source and docs for coding agents, plus an AGENTS.md block that points to them"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/lukaprsina/refs-cli"
license = "MIT"
readme = "README.md"
keywords = ["agents", "ai", "documentation", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["prototype/", "docs/", "TODO.md", ".githooks/", ".github/"]

# cargo-release: CI publishes (dist + trusted publishing), so only bump, tag and push.
[package.metadata.release]
publish = false
allow-branch = ["main"]

[features]
# Exposes `source::fake` to integration tests and downstream test code.
testing = []

[dependencies]
axoupdater = { version = "0.10.2", features = ["blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
fd-lock = "4.0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
miette = { version = "7.6.0", features = ["fancy"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"

[dev-dependencies]
refs-cli = { path = ".", features = ["testing"] }
insta = "1.48.0"
url = "2.5.8"

[[bin]]
name = "refs"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
