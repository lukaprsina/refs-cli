[package]
name = "refs-cli"
version = "0.1.0"
edition = "2024"

[features]
# Exposes `source::fake` to integration tests and downstream test code.
testing = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fd-lock = "4.0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"

[dev-dependencies]
refs-cli = { path = ".", features = ["testing"] }
insta = "1.48.0"
tempfile = "3.27.0"

[[bin]]
name = "refs"
path = "src/main.rs"
